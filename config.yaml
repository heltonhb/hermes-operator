# ── Modelo padrão ──────────────────────────────────────────────
# Provider: groq (com API key via GROQ_API_KEY)
# Modelo: llama-3.3-70b-versatile (gratuito e rápido)
# Fallback: openrouter (deepseek/deepseek-chat)
# Pode ser sobrescrito via env vars HERMES_MODEL / HERMES_PROVIDER
model:
  default: llama-3.3-70b-versatile
  provider: groq

# ── Providers ─────────────────────────────────────────────────
providers:
  opencode:
    name: OpenCode Zen
    api: https://opencode.ai/zen/go/v1
    key_env: OPENCODE_ZEN_API_KEY
    default_model: deepseek/deepseek-v4-flash:free
    models:
    - deepseek/deepseek-v4-flash:free
    api_mode: chat_completions
  groq:
    name: Groq (Free)
    key_env: GROQ_API_KEY
    api: https://api.groq.com/openai/v1
    default_model: llama-3.3-70b-versatile
    models:
    - llama-3.3-70b-versatile
    - llama-3.1-8b-instant
    - meta-llama/llama-4-scout-17b-16e-instruct
    - deepseek-r1-distill-70b
    api_mode: chat_completions
  openrouter:
    name: OpenRouter
    key_env: OPENROUTER_API_KEY
    api: https://openrouter.ai/api/v1
    default_model: deepseek/deepseek-chat
    models:
    - deepseek/deepseek-chat
    - deepseek/deepseek-r1
    - anthropic/claude-sonnet-4
    api_mode: chat_completions

# ── Gateway ────────────────────────────────────────────────────
gateway:
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  platforms:
    telegram:
      enabled: true
      # Token via env var TELEGRAM_BOT_TOKEN
      # Usa long polling direto (conexão persistente no Space)
    whatsapp:
      enabled: true
      # WhatsApp usa relay para o gateway local
      relay_url: https://ce02-2804-7f0-b102-3ca8-9e3b-dfe2-c404-8da4.ngrok-free.app
      relay_api_key: hermes-bridge-local-2026

# ── Segurança ──────────────────────────────────────────────────
security:
  redact_secrets: true
  tirith_enabled: true

# ── Sessões ────────────────────────────────────────────────────
sessions:
  auto_prune: true
  retention_days: 30

# ── Exibição ───────────────────────────────────────────────────
display:
  language: pt
  show_cost: false

# ── Ferramentas disponíveis na API ─────────────────────────────
platform_toolsets:
  api_server:
    - web
