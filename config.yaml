# ── Modelo padrão ──────────────────────────────────────────────
# Provider: opencode-zen (gratuito, sem chave de API)
# Modelo: deepseek-v4-flash-free (mesmo usado localmente)
# Pode ser sobrescrito via env vars HERMES_MODEL / HERMES_PROVIDER / OPENCODE_ZEN_BASE_URL
model:
  default: deepseek-v4-flash-free
  provider: opencode-zen
  base_url: https://opencode.ai/zen/v1

# ── Gateway ────────────────────────────────────────────────────
gateway:
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600

# ── Segurança ──────────────────────────────────────────────────
security:
  redact_secrets: true
  tirith_enabled: true

# ── Sessões ────────────────────────────────────────────────────
sessions:
  auto_prune: true
  retention_days: 30

# ── Exibição ───────────────────────────────────────────────────
display:
  language: pt
  show_cost: false

# ── Ferramentas disponíveis na API ─────────────────────────────
# A API server não tem acesso a terminal/arquivos locais,
# apenas ao LLM puro para chat completion.
platform_toolsets:
  api_server:
    - web
