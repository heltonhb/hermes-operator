# ── Modelo padrão ──────────────────────────────────────────────
# Provider: openrouter (com API key via OPENROUTER_API_KEY)
# Modelo: deepseek/deepseek-v4-flash (mesma família DeepSeek V4 que o local)
# Pode ser sobrescrito via env vars HERMES_MODEL / HERMES_PROVIDER
model:
  default: deepseek/deepseek-v4-flash
  provider: openrouter

# ── Gateway ────────────────────────────────────────────────────
gateway:
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  platforms:
    telegram:
      enabled: true
      # Token via env var TELEGRAM_BOT_TOKEN
      # Webhook configurado via Telegram API setWebhook
    whatsapp:
      enabled: true
      # WhatsApp usa relay para o gateway local
      relay_url: https://ce02-2804-7f0-b102-3ca8-9e3b-dfe2-c404-8da4.ngrok-free.app
      relay_api_key: hermes-bridge-local-2026

# ── Segurança ──────────────────────────────────────────────────
security:
  redact_secrets: true
  tirith_enabled: true

# ── Sessões ────────────────────────────────────────────────────
sessions:
  auto_prune: true
  retention_days: 30

# ── Exibição ───────────────────────────────────────────────────
display:
  language: pt
  show_cost: false

# ── Ferramentas disponíveis na API ─────────────────────────────
platform_toolsets:
  api_server:
    - web
