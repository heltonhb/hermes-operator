/root/.hermes/logs/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 0640 root root
    sharedscripts
    postrotate
        # Reiniciar serviços se necessário
        # systemctl restart hermes-operator >/dev/null 2>&1 || true
    endscript
}

/root/.hermes/logs/gateway.log /root/.hermes/logs/proxy.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 0640 root root
    sharedscripts
    notifempty
    create 0640 root root
    sharedscripts
}
